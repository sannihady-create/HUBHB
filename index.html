<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUBHB - Gagner de l'argent en regardant des pubs</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    .header { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .balance-box { font-size: 1.2rem; font-weight: bold; color: #28a745; }
    .ad-card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    button { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    button:hover { background-color: #218838; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="header">
    <h1>HUBHB PTC</h1>
    <div class="balance-box">Solde : <span id="user-balance">0.0000</span> $</div>
  </div>

  <h2>Publicités disponibles</h2>
  <div id="ads-container">Chargement des publicités...</div>

  <script>
    const testUserId = '1';

    // Charger le solde de l'utilisateur
    async function fetchUserBalance() {
      try {
        const res = await fetch(`/api/user/${testUserId}`);
        const data = await res.json();
        if (data.balance !== undefined) {
          document.getElementById('user-balance').innerText = parseFloat(data.balance).toFixed(4);
        }
      } catch (err) {
        console.error("Erreur de chargement du solde", err);
      }
    }

    async function fetchAds() {
      try {
        const response = await fetch('/api/ads');
        const ads = await response.json();
        
        const container = document.getElementById('ads-container');
        container.innerHTML = '';

        if (!ads || ads.length === 0) {
          container.innerHTML = '<p>Aucune publicité disponible pour le moment.</p>';
          return;
        }

        ads.forEach(ad => {
          const adElement = document.createElement('div');
          adElement.className = 'ad-card';
          adElement.innerHTML = `
            <h3>${ad.title}</h3>
            <p>Gain : <strong>${ad.reward_amount} $</strong> | Durée : ${ad.duration_seconds} sec</p>
            <button id="btn-${ad.id}" onclick="watchAd('${ad.id}', '${ad.ad_url}', ${ad.duration_seconds})">
              Regarder l'annonce
            </button>
          `;
          container.appendChild(adElement);
        });
      } catch (err) {
        document.getElementById('ads-container').innerHTML = 'Erreur lors du chargement des annonces.';
      }
    }

    async function watchAd(adId, adUrl, duration) {
      const btn = document.getElementById(`btn-${adId}`);
      btn.disabled = true;

      window.open(adUrl, '_blank');

      let timer = duration;
      btn.innerText = `Patienter... ${timer}s`;

      const interval = setInterval(async () => {
        timer--;
        btn.innerText = `Patienter... ${timer}s`;

        if (timer <= 0) {
          clearInterval(interval);
          btn.innerText = "Validation en cours...";

          try {
            const res = await fetch('/api/watch-ad', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userId: testUserId, adId: adId })
            });

            const data = await res.json();
            if (res.ok) {
              btn.innerText = "Gain crédité ! ✅";
              alert(`Bravo ! Vous avez gagné ${data.reward} $`);
              fetchUserBalance(); // Mettre à jour le solde à l'écran
            } else {
              btn.innerText = "Erreur";
              alert(data.error || "Erreur de validation");
            }
          } catch (err) {
            btn.innerText = "Erreur de connexion";
          }
        }
      }, 1000);
    }

    // Initialisation
    fetchUserBalance();
    fetchAds();
  </script>
</body>
</html>
