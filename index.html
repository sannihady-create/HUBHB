<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUBHB PTC</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h1 { margin-top: 0; }
    .hidden { display: none; }
    .card { border: 1px solid #ddd; padding: 15px; border-radius: 5px; margin-bottom: 10px; }
    button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .auth-box { max-width: 400px; margin: auto; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
  </style>
</head>
<body>

  <div class="container">
    <div id="auth-section" class="auth-box">
      <h2>Connexion / Inscription</h2>
      <input type="text" id="auth-username" placeholder="Nom d'utilisateur (pour inscription)">
      <input type="email" id="auth-email" placeholder="Email">
      <input type="password" id="auth-password" placeholder="Mot de passe">
      <button onclick="login()">Se connecter</button>
      <button onclick="register()" style="background:#007bff;">S'inscrire</button>
    </div>

    <div id="dashboard" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>HUBHB PTC</h1>
        <div>
          <span>Bienvenue, <b id="user-name"></b> !</span><br>
          <span style="color: green; font-weight: bold;">Solde : <span id="user-balance">0.0000</span> $</span><br>
          <button onclick="logout()" style="background:#dc3545; padding: 5px 10px; margin-top: 5px;">Deconnexion</button>
        </div>
      </div>
      <hr>
      <h2>Publicités disponibles</h2>
      <div id="ads-list"></div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('token') || null;

    async function updateUI() {
      if (token) {
        const res = await fetch('/api/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const user = await res.json();
          document.getElementById('auth-section').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          document.getElementById('user-name').innerText = user.username;
          document.getElementById('user-balance').innerText = parseFloat(user.balance).toFixed(4);
          fetchAds();
        } else {
          logout();
        }
      } else {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
      }
    }

    async function register() {
      const username = document.getElementById('auth-username').value;
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();
      if (res.ok) {
        alert("Compte crée avec succès ! Connecte-toi.");
      } else {
        alert(data.error);
      }
    }

    async function login() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        localStorage.setItem('token', token);
        updateUI();
      } else {
        alert(data.error);
      }
    }

    function logout() {
      localStorage.removeItem('token');
      token = null;
      updateUI();
    }

    async function fetchAds() {
      const res = await fetch('/api/ads', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const ads = await res.json();
      const adsList = document.getElementById('ads-list');
      adsList.innerHTML = '';

      ads.forEach(ad => {
        const div = document.createElement('div');
        div.className = 'card';
        
        const isWatched = ad.watched;
        const buttonHTML = isWatched 
          ? `<button disabled style="background:#6c757d;">Déjà vue aujourd'hui ✅</button>`
          : `<button id="btn-${ad.id}" onclick="watchAd(${ad.id}, '${ad.ad_url}', ${ad.duration_seconds})">Regarder l'annonce</button>`;

        div.innerHTML = `
          <h3>${ad.title}</h3>
          <p>Gain : <b>${parseFloat(ad.reward_amount).toFixed(4)} $</b> | Durée : ${ad.duration_seconds} sec</p>
          ${buttonHTML}
        `;
        adsList.appendChild(div);
      });
    }

    async function watchAd(adId, adUrl, duration) {
      const btn = document.getElementById(`btn-${adId}`);
      btn.disabled = true;
      window.open(adUrl, '_blank');

      let timer = duration;
      const interval = setInterval(async () => {
        timer--;
        btn.innerText = `Patienter... ${timer}s`;
        if (timer <= 0) {
          clearInterval(interval);
          btn.innerText = "Validation...";
          const res = await fetch('/api/watch-ad', {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ adId })
          });
          const data = await res.json();
          if (res.ok) {
            btn.innerText = "Gain crédité ! ✅";
            updateUI();
          } else {
            alert(data.error);
            btn.innerText = "Erreur";
          }
        }
      }, 1000);
    }

    updateUI();
  </script>
</body>
</html>
