<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUBHB PTC</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .balance-box { font-size: 1.2rem; font-weight: bold; color: #28a745; }
    input { display: block; width: 90%; margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    button { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- Section Authentification -->
  <div id="auth-section" class="card">
    <h2>Connexion / Inscription</h2>
    <input type="text" id="auth-username" placeholder="Nom d'utilisateur (pour l'inscription)">
    <input type="email" id="auth-email" placeholder="Email">
    <input type="password" id="auth-password" placeholder="Mot de passe">
    <button onclick="login()">Se connecter</button>
    <button onclick="register()" style="background-color: #007bff;">S'inscrire</button>
  </div>

  <!-- Section Dashboard -->
  <div id="dashboard" class="hidden">
    <div class="header card">
      <h1>HUBHB PTC</h1>
      <div>
        <p>Bienvenue, <strong id="user-name"></strong> !</p>
        <div class="balance-box">Solde : <span id="user-balance">0.0000</span> $</div>
        <button onclick="logout()" style="background-color: #dc3545; margin-top: 5px;">Déconnexion</button>
      </div>
    </div>

    <h2>Publicités disponibles</h2>
    <div id="ads-container">Chargement des publicités...</div>
  </div>

  <script>
    let currentUser = JSON.parse(localStorage.getItem('user')) || null;

    function updateUI() {
      if (currentUser) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('user-name').innerText = currentUser.username;
        fetchUserBalance();
        fetchAds();
      } else {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('dashboard').classList.add('hidden');
      }
    }

    async function register() {
      const username = document.getElementById('auth-username').value;
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();
      if (res.ok) {
        alert("Compte créé ! Connectez-vous.");
      } else {
        alert(data.error);
      }
    }

    async function login() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        currentUser = data.user;
        localStorage.setItem('user', JSON.stringify(currentUser));
        updateUI();
      } else {
        alert(data.error);
      }
    }

    function logout() {
      localStorage.removeItem('user');
      currentUser = null;
      updateUI();
    }

    async function fetchUserBalance() {
      if (!currentUser) return;
      const res = await fetch(`/api/user/${currentUser.id}`);
      const data = await res.json();
      if (data.balance !== undefined) {
        document.getElementById('user-balance').innerText = parseFloat(data.balance).toFixed(4);
      }
    }

    async function fetchAds() {
      const response = await fetch('/api/ads');
      const ads = await response.json();
      const container = document.getElementById('ads-container');
      container.innerHTML = '';

      ads.forEach(ad => {
        const adElement = document.createElement('div');
        adElement.className = 'card';
        adElement.innerHTML = `
          <h3>${ad.title}</h3>
          <p>Gain : <strong>${ad.reward_amount} $</strong> | Durée : ${ad.duration_seconds} sec</p>
          <button id="btn-${ad.id}" onclick="watchAd('${ad.id}', '${ad.ad_url}', ${ad.duration_seconds})">Regarder l'annonce</button>
        `;
        container.appendChild(adElement);
      });
    }

    async function watchAd(adId, adUrl, duration) {
      const btn = document.getElementById(`btn-${adId}`);
      btn.disabled = true;
      window.open(adUrl, '_blank');

      let timer = duration;
      const interval = setInterval(async () => {
        timer--;
        btn.innerText = `Patienter... ${timer}s`;
        if (timer <= 0) {
          clearInterval(interval);
          btn.innerText = "Validation...";
          const res = await fetch('/api/watch-ad', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: currentUser.id, adId })
          });
          if (res.ok) {
            btn.innerText = "Gain crédité ! ✅";
            fetchUserBalance();
          } else {
            btn.innerText = "Erreur";
          }
        }
      }, 1000);
    }

    updateUI();
  </script>
</body>
</html>
