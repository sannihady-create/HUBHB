<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUBHB - Gagnez de l'argent en ligne</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: #0f172a; color: #1e293b; display: flex; justify-content: center; min-height: 100vh; padding: 15px; }
    
    .app-container { width: 100%; max-width: 420px; background: #ffffff; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
    
    /* Header Pro */
    .header { background: linear-gradient(135deg, #059669 0%, #10b981 100%); padding: 25px 20px; color: white; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; text-align: center; }
    .header h1 { font-size: 26px; font-weight: 800; letter-spacing: 1px; }
    .balance-card { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); margin-top: 15px; padding: 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); }
    .balance-title { font-size: 13px; text-transform: uppercase; opacity: 0.9; letter-spacing: 0.5px; }
    .balance-amount { font-size: 28px; font-weight: 700; color: #ffffff; margin-top: 2px; }

    .content { padding: 20px; flex: 1; }
    
    /* Formulair auth */
    .form-group { margin-bottom: 15px; }
    label { font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 14px; outline: none; transition: 0.2s; }
    input:focus { border-color: #10b981; }
    
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; margin-top: 8px; }
    .btn-primary { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 4px 12px rgba(16,185,129,0.3); }
    .btn-secondary { background: #f1f5f9; color: #334155; }
    .btn:active { transform: scale(0.98); }

    /* Liste des pubs */
    .section-title { font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
    .badge-count { background: #e0e7ff; color: #4338ca; padding: 4px 10px; border-radius: 20px; font-size: 12px; }

    .ad-item { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
    .ad-info h4 { font-size: 14px; color: #1e293b; font-weight: 600; }
    .ad-reward { font-size: 13px; color: #059669; font-weight: 700; margin-top: 2px; }
    
    .btn-watch { padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; border: none; cursor: pointer; background: #10b981; color: white; }
    .btn-watch:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }

    /* Logos opérateurs */
    .payment-methods { display: flex; justify-content: center; gap: 15px; margin-top: 20px; padding-top: 15px; border-top: 1px solid #f1f5f9; font-size: 11px; font-weight: 700; color: #64748b; }

    .hidden { display: none; }
    .message { text-align: center; font-size: 13px; margin-top: 10px; font-weight: 600; }
    .error { color: #ef4444; }
    .success { color: #10b981; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <h1>HUBHB</h1>
      <div id="userCard" class="balance-card hidden">
        <div class="balance-title">Solde Total</div>
        <div class="balance-amount"><span id="userBalance">0</span> FCFA</div>
      </div>
    </div>

    <div class="content">
      <!-- Section Connexion/Inscription -->
      <div id="authSection">
        <h3 style="margin-bottom: 15px; text-align: center; color: #0f172a;">Espace Membre</h3>
        <div class="form-group">
          <label>Nom d'utilisateur</label>
          <input type="text" id="username" placeholder="Votre pseudonyme">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="exemple@mail.com">
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="btn btn-primary" id="loginBtn">Se Connecter</button>
        <button class="btn btn-secondary" id="registerBtn">Créer un Compte</button>
        <div id="authMessage" class="message"></div>
      </div>

      <!-- Tableau de Bord -->
      <div id="dashboardSection" class="hidden">
        <div class="section-title">
          <span>Publicités Du Jour</span>
          <span class="badge-count">50 Dispo</span>
        </div>

        <div id="adsList"></div>

        <button id="logoutBtn" class="btn btn-secondary" style="margin-top: 20px;">Se Déconnecter</button>
      </div>

      <!-- Méthodes de retrait affichées en bas -->
      <div class="payment-methods">
        <span>MOOV MONEY</span> • <span>MTN</span> • <span>WAVE</span> • <span>ORANGE</span>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '/api';

    const loginBtn = document.getElementById('loginBtn');
    const registerBtn = document.getElementById('registerBtn');
    const authMessage = document.getElementById('authMessage');
    const authSection = document.getElementById('authSection');
    const dashboardSection = document.getElementById('dashboardSection');
    const userCard = document.getElementById('userCard');

    loginBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMessage('Remplissez l\'email et le mot de passe.', true);
        return;
      }

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Erreur de connexion');

        localStorage.setItem('hubhb_token', data.token);

        if (data.user) {
          document.getElementById('userBalance').textContent = Math.round(data.user.balance);
        }

        authSection.classList.add('hidden');
        dashboardSection.classList.remove('hidden');
        userCard.classList.remove('hidden');
        loadAds();

      } catch (err) {
        showMessage(err.message, true);
      }
    });

    registerBtn.addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !email || !password) {
        showMessage('Veuillez remplir tous les champs.', true);
        return;
      }

      try {
        const res = await fetch(`${API_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Erreur lors de l\'inscription');

        showMessage('Compte créé ! Cliquez sur Se connecter.', false);
      } catch (err) {
        showMessage(err.message, true);
      }
    });

    function showMessage(msg, isError) {
      authMessage.textContent = msg;
      authMessage.className = `message ${isError ? 'error' : 'success'}`;
    }

    async function loadAds() {
      const token = localStorage.getItem('hubhb_token');
      try {
        const res = await fetch(`${API_URL}/ads`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const ads = await res.json();
        const adsList = document.getElementById('adsList');
        adsList.innerHTML = '';

        if (!Array.isArray(ads) || ads.length === 0) {
          adsList.innerHTML = '<p style="text-align:center; color:#64748b; font-size:13px;">Aucune publicité disponible.</p>';
          return;
        }

        ads.forEach(ad => {
          const div = document.createElement('div');
          div.className = 'ad-item';
          div.innerHTML = `
            <div class="ad-info">
              <h4>${ad.title || 'Publicité Sponsorisée'}</h4>
              <div class="ad-reward">+${Math.round(ad.reward_amount)} FCFA</div>
            </div>
            <button class="btn-watch" onclick="watchAd(${ad.id})" ${ad.watched ? 'disabled' : ''}>
              ${ad.watched ? 'Déjà vue' : 'Regarder'}
            </button>
          `;
          adsList.appendChild(div);
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function watchAd(adId) {
      const token = localStorage.getItem('hubhb_token');
      try {
        const res = await fetch(`${API_URL}/watch-ad`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ adId })
        });
        const data = await res.json();
        if (res.ok) {
          const currentBal = parseFloat(document.getElementById('userBalance').textContent) || 0;
          document.getElementById('userBalance').textContent = Math.round(currentBal + parseFloat(data.reward));
          loadAds();
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Erreur lors du visionnage');
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('hubhb_token');
      authSection.classList.remove('hidden');
      dashboardSection.classList.add('hidden');
      userCard.classList.add('hidden');
    });
  </script>
</body>
</html>
